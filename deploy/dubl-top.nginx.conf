# Проксі для API dubl.top.
# ДОДАТИ цей location ВСЕРЕДИНУ вже існуючого server-блоку на 443
# (/etc/nginx/sites-available/dubl.top), який створив certbot.
# Статика (index.html) віддається напряму, /api/ йде на ізольований сервіс.
#
#   location / { try_files $uri $uri/ =404; }   <-- вже є
#
# Додати поруч:

location /api/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # Скриншоти можуть важити кілька МБ:
    client_max_body_size 25m;
}
